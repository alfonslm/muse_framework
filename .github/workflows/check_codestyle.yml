name: 'Check: Codestyle'

on:
  # FontDaw: manual only until a self-hosted runner exists; at an upstream catch-up keep this side
  workflow_dispatch:

jobs:
  codestyle:
    runs-on: ubuntu-slim
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install CMake
        run: |
          sudo apt update
          sudo apt install -y cmake  

      - name: Test MF coding style
        run: |
          cmake -P ./buildscripts/ci/checkcodestyle/checkcodestyle.cmake ./framework/
